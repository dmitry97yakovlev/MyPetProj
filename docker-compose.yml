services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mypetproj
      POSTGRES_PASSWORD: mypetproj
      POSTGRES_DB: mypetproj
    ports:
      # 5433 на хосте — 5432 внутри контейнера уже занят другим Postgres на этой машине.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
